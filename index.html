<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSで回転する青い四角形</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- 回転させる青い四角形 -->
    <div id="blueBox" class="box"></div>

    <!-- コントロール用ボタン -->
    <div class="controls">
      <button id="toggleBtn">ストップ</button>
      <button id="speedUpBtn">スピードアップ</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
